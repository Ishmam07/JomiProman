<!doctype html>
<html lang="bn" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />
    <meta
      name="description"
      content="জমি প্রমাণ: জাল দলিল ও একই জমি দুইবার বিক্রি ধরার ভূমি-রেকর্ড যাচাই ব্যবস্থা"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var th = localStorage.getItem("jomiproman.theme");
        if (!th && window.matchMedia("(prefers-color-scheme: dark)").matches) th = "dark";
        document.documentElement.dataset.theme = th || "light";
      } catch (e) {}
    </script>
    <title>জমি প্রমাণ · JomiProman</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
